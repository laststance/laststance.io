name: Storybook
on:
  pull_request: ~
  push:
    branches:
      - main
jobs:
  storybook-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
      - name: Install Chromium for the story tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run every story as a test, with axe accessibility checks
        run: pnpm test:storybook
