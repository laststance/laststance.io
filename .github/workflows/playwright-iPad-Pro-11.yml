name: iPad Pro 11 E2E Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  iPad-Pro-11-e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - run: |
          {
            echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}"
            echo "PERSONAL_ACCESS_TOKEN=${{ secrets.PERSONAL_ACCESS_TOKEN }}"
            echo "ARGOS_TOKEN=${{ secrets.ARGOS_TOKEN }}"
          } >> .env
      - name: Build Next
        run: pnpm build
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Set build name
        run: echo "BUILD_NAME='iPad Pro 11'" >> .env
      - name: Set Argos upload flag based on actor
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "UPLOAD_TO_ARGOS=false" >> .env
          else
            echo "UPLOAD_TO_ARGOS=true" >> .env
          fi
      - name: Playwright tests
        shell: bash
        run: pnpm exec playwright test --project='iPad Pro 11' --project='iPad Pro 11 landscape' 2>&1 | tee playwright-output.txt
      - name: Report the Argos result as a commit status
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_CONTEXT: Argos (iPad Pro 11)
        run: node scripts/argos-status.mjs playwright-output.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('argos-result.json') != '' }}
        with:
          name: argos-result-ipad-pro-11
          path: argos-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
